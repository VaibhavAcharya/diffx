name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Lets npm authenticate over OIDC, so no long-lived token is stored.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # npm rather than pnpm: the OIDC handshake lives in the npm CLI.
      - run: npm publish --provenance --access public
